name: Generate and publish SDK
run-name: SDK ${{ inputs.mode }} v${{ inputs.set_version }} (${{ inputs.source_revision }})

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Force preview generation even when Speakeasy detects no changes
        type: boolean
        default: false
      mode:
        description: Preview with pr, publish with direct, or validate with test
        type: choice
        options: [pr, direct, test]
        default: pr
      set_version:
        description: Exact synchronized SDK SemVer
        type: string
        required: true
      feature_branch:
        description: Branch name for preview PRs
        type: string
        required: false
      environment:
        description: Immutable Speakeasy source tag as TAG=<tag>
        type: string
        required: true
      source_revision:
        description: Exact source API Git revision
        type: string
        required: true
      contract_digest:
        description: Canonical production OpenAPI sha256 digest
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate-inputs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate immutable release inputs
        shell: bash
        env:
          SDK_MODE: ${{ inputs.mode }}
          SDK_VERSION: ${{ inputs.set_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_DIGEST: ${{ inputs.contract_digest }}
          SOURCE_ENVIRONMENT: ${{ inputs.environment }}
          FEATURE_BRANCH: ${{ inputs.feature_branch }}
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${SDK_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CONTRACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "${SDK_MODE}" = "pr" ]]; then
            test "${FEATURE_BRANCH}" = "sdk-v${SDK_VERSION}-${SOURCE_REVISION:0:12}"
          fi
          if [[ "${SDK_MODE}" = "direct" ]]; then
            test "${SOURCE_ENVIRONMENT}" = "TAG=v${SDK_VERSION}"
          else
            [[ "${SOURCE_ENVIRONMENT}" =~ ^TAG=[A-Za-z0-9._-]+$ ]]
          fi

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pr'
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the SDK repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pinned Speakeasy generation action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: speakeasy-api/sdk-generation-action
          ref: fa50f4813201c6f919c74c25196b17c070ec4ac1
          path: _speakeasy
          persist-credentials: false
      - name: Generate the reviewed SDK branch and PR
        uses: ./_speakeasy
        with:
          speakeasy_version: 1.794.0
          github_access_token: ${{ github.token }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
          mode: pr
          force: ${{ inputs.force }}
          set_version: ${{ inputs.set_version }}
          feature_branch: ${{ inputs.feature_branch }}
          cli_environment_variables: ${{ inputs.environment }}
          github_repository: x402api-com/x402api-typescript
          enable_sdk_changelog: true

  finalize-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pr'
    needs: [validate-inputs, preview]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.feature_branch }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate the generated branch and deployed contract
        shell: bash
        env:
          FEATURE_BRANCH: ${{ inputs.feature_branch }}
          SDK_VERSION: ${{ inputs.set_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_DIGEST: ${{ inputs.contract_digest }}
        run: |
          set -Eeuo pipefail
          expected_branch="sdk-v${SDK_VERSION}-${SOURCE_REVISION:0:12}"
          test "${FEATURE_BRANCH}" = "${expected_branch}"
          test "$(git branch --show-current)" = "${FEATURE_BRANCH}"
          if git grep -n -E '^(<{7}|={7}|>{7})( |$)'; then
            echo "::error title=Unresolved generated-source conflict::Conflict markers remain in the generated TypeScript SDK."
            exit 1
          fi
          headers="${RUNNER_TEMP}/production-health.headers"
          public_contract="${RUNNER_TEMP}/public-openapi.json"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --dump-header "${headers}" \
            --output /dev/null https://api.x402api.com/health/ready
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output "${public_contract}" https://api.x402api.com/openapi/openapi.json
          python - "${headers}" "${public_contract}" <<'PY'
          import hashlib, json, os, pathlib, sys
          revisions = [line.split(":", 1)[1].strip() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.lower().startswith("x-x402api-release:")]
          if revisions != [os.environ["SOURCE_REVISION"]]:
              raise SystemExit(f"production revision mismatch: {revisions!r}")
          document = json.loads(pathlib.Path(sys.argv[2]).read_text())
          canonical = json.dumps(document, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          digest = f"sha256:{hashlib.sha256(canonical).hexdigest()}"
          if digest != os.environ["CONTRACT_DIGEST"] or document.get("info", {}).get("version") != os.environ["SDK_VERSION"]:
              raise SystemExit("production contract identity mismatch")
          PY
          python scripts/render-openapi.py \
            --input "${public_contract}" --output "${RUNNER_TEMP}/sdk-openapi.json"
          python scripts/write-release-manifest.py \
            --public-openapi "${public_contract}" \
            --sdk-openapi "${RUNNER_TEMP}/sdk-openapi.json" \
            --version "${SDK_VERSION}" \
            --source-revision "${SOURCE_REVISION}" \
            --contract-digest "${CONTRACT_DIGEST}"

      - name: Test and finalize the reviewed source
        shell: bash
        env:
          FEATURE_BRANCH: ${{ inputs.feature_branch }}
          SDK_VERSION: ${{ inputs.set_version }}
        run: |
          set -Eeuo pipefail
          test "$(node -p 'require("./package.json").version')" = "${SDK_VERSION}"
          test "$(node -p 'require("./jsr.json").version')" = "${SDK_VERSION}"
          test "$(sed -n 's/^  releaseVersion: //p' .speakeasy/gen.lock)" = "${SDK_VERSION}"
          npm install --global npm@12.0.2
          npm ci
          python -m unittest discover -s tests -p 'test_*.py'
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high
          npm pack --dry-run
          git diff --check
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --exit-code -- . ':(exclude).x402api/release.json'
          git config user.name "x402api SDK automation"
          git config user.email "sdk-automation@x402api.com"
          git add .x402api/release.json
          if ! git diff --cached --quiet; then
            git commit -m "Bind TypeScript SDK v${SDK_VERSION} provenance"
            git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          fi

  validate-or-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'pr'
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require the default branch for publication
        if: inputs.mode == 'direct'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Require the exact deployed production contract
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_DIGEST: ${{ inputs.contract_digest }}
        run: |
          set -Eeuo pipefail
          headers="${RUNNER_TEMP}/production-health.headers"
          contract="${RUNNER_TEMP}/live-openapi.json"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --dump-header "${headers}" \
            --output /dev/null https://api.x402api.com/health/ready
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output "${contract}" \
            https://api.x402api.com/openapi/openapi.json
          python - "${headers}" "${contract}" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          headers = pathlib.Path(sys.argv[1]).read_text().splitlines()
          revisions = [
              line.split(":", 1)[1].strip()
              for line in headers
              if line.lower().startswith("x-x402api-release:")
          ]
          if revisions != [os.environ["SOURCE_REVISION"]]:
              raise SystemExit(f"production revision mismatch: {revisions!r}")
          document = json.loads(pathlib.Path(sys.argv[2]).read_text())
          canonical = json.dumps(
              document, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          ).encode()
          digest = f"sha256:{hashlib.sha256(canonical).hexdigest()}"
          if digest != os.environ["CONTRACT_DIGEST"]:
              raise SystemExit(f"contract digest mismatch: {digest}")
          if document.get("info", {}).get("version") != os.environ["SDK_VERSION"]:
              raise SystemExit("production contract version mismatch")
          PY
          python scripts/render-openapi.py \
            --input "${contract}" \
            --output "${RUNNER_TEMP}/sdk-openapi.json"

      - name: Require the reviewed SDK source manifest
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_DIGEST: ${{ inputs.contract_digest }}
        run: |
          set -Eeuo pipefail
          test "$(node -p 'require("./package.json").version')" = "${SDK_VERSION}"
          test "$(node -p 'require("./jsr.json").version')" = "${SDK_VERSION}"
          test "$(sed -n 's/^  releaseVersion: //p' .speakeasy/gen.lock)" = "${SDK_VERSION}"
          python - "${RUNNER_TEMP}/sdk-openapi.json" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          manifest = json.loads(pathlib.Path(".x402api/release.json").read_text())
          expected = {
              "record_type": "x402api-sdk-source",
              "version": os.environ["SDK_VERSION"],
              "source_revision": os.environ["SOURCE_REVISION"],
              "openapi_sha256": os.environ["CONTRACT_DIGEST"],
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(
                      f"release manifest {key} mismatch: {manifest.get(key)!r}"
                  )
          rendered = json.loads(pathlib.Path(sys.argv[1]).read_text())
          canonical = json.dumps(
              rendered, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          ).encode()
          digest = f"sha256:{hashlib.sha256(canonical).hexdigest()}"
          if manifest.get("sdk_openapi_sha256") != digest:
              raise SystemExit(f"SDK contract digest mismatch: {digest}")
          PY

      - name: Install, test, and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --global npm@12.0.2
          npm ci
          python -m unittest discover -s tests -p 'test_*.py'
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high
          npm pack --dry-run
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Detect existing package and version publications
        id: publication
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
        run: |
          set -Eeuo pipefail
          if npm view "@x402api/sdk" version \
              --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "package_exists=true" >>"${GITHUB_OUTPUT}"
          else
            echo "package_exists=false" >>"${GITHUB_OUTPUT}"
          fi
          if npm view "@x402api/sdk@${SDK_VERSION}" version \
              --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Require scoped bootstrap authentication for the first package
        if: inputs.mode == 'test' && steps.publication.outputs.package_exists != 'true'
        shell: bash
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${NPM_BOOTSTRAP_TOKEN}"

      - name: Publish with npm Trusted Publishing or the scoped bootstrap token
        if: inputs.mode == 'direct' && steps.publication.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish --access public --provenance

      - name: Verify the public package and record the source tag
        if: inputs.mode == 'direct'
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
        run: |
          set -Eeuo pipefail
          for _ in $(seq 1 30); do
            published="$(npm view "@x402api/sdk@${SDK_VERSION}" version \
              --registry https://registry.npmjs.org 2>/dev/null || true)"
            [[ "${published}" = "${SDK_VERSION}" ]] && break
            sleep 5
          done
          test "${published}" = "${SDK_VERSION}"
          tag="v${SDK_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            test "$(git rev-list -n 1 "${tag}")" = "${GITHUB_SHA}"
          else
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi

  pull-request-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install, test, and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --global npm@12.0.2
          npm ci
          python -m unittest discover -s tests -p 'test_*.py'
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high
          npm pack --dry-run
          git diff --exit-code
