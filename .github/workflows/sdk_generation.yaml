name: Generate and publish SDK
run-name: SDK ${{ inputs.mode }} v${{ inputs.set_version }} (${{ inputs.source_revision }})

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Force preview generation even when Speakeasy detects no changes
        type: boolean
        default: false
      mode:
        description: Preview with pr, publish with direct, or validate with test
        type: choice
        options: [pr, direct, test]
        default: pr
      set_version:
        description: Exact synchronized SDK SemVer
        type: string
        required: true
      feature_branch:
        description: Branch name for preview PRs
        type: string
        required: false
      environment:
        description: Immutable Speakeasy source tag as TAG=<tag>
        type: string
        required: true
      source_revision:
        description: Exact source API Git revision
        type: string
        required: true
      contract_digest:
        description: Canonical production OpenAPI sha256 digest
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate-inputs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate immutable release inputs
        shell: bash
        env:
          SDK_MODE: ${{ inputs.mode }}
          SDK_VERSION: ${{ inputs.set_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_DIGEST: ${{ inputs.contract_digest }}
          SOURCE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -Eeuo pipefail
          [[ "${SDK_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CONTRACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "${SDK_MODE}" = "direct" ]]; then
            test "${SOURCE_ENVIRONMENT}" = "TAG=v${SDK_VERSION}"
          else
            [[ "${SOURCE_ENVIRONMENT}" =~ ^TAG=[A-Za-z0-9._-]+$ ]]
          fi

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'pr'
    needs: validate-inputs
    permissions:
      checks: write
      contents: write
      pull-requests: write
      statuses: write
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@68f3bfefb79354d39358bf4699863dabd2cea0f6
    with:
      force: ${{ inputs.force }}
      mode: pr
      set_version: ${{ inputs.set_version }}
      feature_branch: ${{ inputs.feature_branch }}
      environment: ${{ inputs.environment }}
      speakeasy_version: 1.794.0
      github_repository: x402api-com/x402api-typescript
      runs-on: ubuntu-latest
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}

  validate-or-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'pr'
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require the exact deployed production contract
        if: inputs.mode == 'direct'
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CONTRACT_DIGEST: ${{ inputs.contract_digest }}
        run: |
          set -Eeuo pipefail
          headers="${RUNNER_TEMP}/production-health.headers"
          contract="${RUNNER_TEMP}/live-openapi.json"
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --dump-header "${headers}" \
            --output /dev/null https://api.x402api.com/health/ready
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output "${contract}" \
            https://api.x402api.com/openapi/openapi.json
          python - "${headers}" "${contract}" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          headers = pathlib.Path(sys.argv[1]).read_text().splitlines()
          revisions = [
              line.split(":", 1)[1].strip()
              for line in headers
              if line.lower().startswith("x-x402api-release:")
          ]
          if revisions != [os.environ["SOURCE_REVISION"]]:
              raise SystemExit(f"production revision mismatch: {revisions!r}")
          document = json.loads(pathlib.Path(sys.argv[2]).read_text())
          canonical = json.dumps(
              document, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          ).encode()
          digest = f"sha256:{hashlib.sha256(canonical).hexdigest()}"
          if digest != os.environ["CONTRACT_DIGEST"]:
              raise SystemExit(f"contract digest mismatch: {digest}")
          if document.get("info", {}).get("version") != os.environ["SDK_VERSION"]:
              raise SystemExit("production contract version mismatch")
          PY

      - name: Require the synchronized SDK version
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
        run: |
          set -Eeuo pipefail
          test "$(node -p 'require("./package.json").version')" = "${SDK_VERSION}"
          test "$(node -p 'require("./jsr.json").version')" = "${SDK_VERSION}"
          test "$(sed -n 's/^  releaseVersion: //p' .speakeasy/gen.lock)" = "${SDK_VERSION}"

      - name: Install the pinned Speakeasy CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/speakeasy_linux_amd64.zip"
          install_root="${RUNNER_TEMP}/speakeasy-1.794.0"
          bin_root="${RUNNER_TEMP}/speakeasy-bin"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            https://github.com/speakeasy-api/speakeasy/releases/download/v1.794.0/speakeasy_linux_amd64.zip
          echo "8d16f94f34a1998f3fcc527fa5683a0458221ece81b6192913a8a6f3b69935f3  ${archive}" \
            | sha256sum --check --strict
          mkdir -p "${install_root}" "${bin_root}"
          unzip -q "${archive}" -d "${install_root}"
          binary="$(find "${install_root}" -type f -name speakeasy -print -quit)"
          test -n "${binary}"
          install -m 0755 "${binary}" "${bin_root}/speakeasy"
          "${bin_root}/speakeasy" --version
          echo "${bin_root}" >>"${GITHUB_PATH}"

      - name: Regenerate from the immutable reviewed source
        env:
          SOURCE_ENVIRONMENT: ${{ inputs.environment }}
          SDK_VERSION: ${{ inputs.set_version }}
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export "${SOURCE_ENVIRONMENT}"
          speakeasy run --target typescript --auto-yes --output console \
            --set-version "${SDK_VERSION}" --skip-versioning --skip-upload-spec
          git diff --exit-code -- . \
            ':(exclude).speakeasy/gen.lock' \
            ':(exclude).speakeasy/workflow.lock'
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Install, test, and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --global npm@12.0.2
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high
          npm pack --dry-run
          git diff --exit-code -- . \
            ':(exclude).speakeasy/gen.lock' \
            ':(exclude).speakeasy/workflow.lock'
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Detect an existing publication
        if: inputs.mode == 'direct'
        id: publication
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
        run: |
          set -Eeuo pipefail
          if npm view "@x402api/sdk@${SDK_VERSION}" version \
              --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Publish with npm Trusted Publishing
        if: inputs.mode == 'direct' && steps.publication.outputs.exists != 'true'
        run: npm publish --access public --provenance

      - name: Verify the public package and record the source tag
        if: inputs.mode == 'direct'
        shell: bash
        env:
          SDK_VERSION: ${{ inputs.set_version }}
        run: |
          set -Eeuo pipefail
          for _ in $(seq 1 30); do
            published="$(npm view "@x402api/sdk@${SDK_VERSION}" version \
              --registry https://registry.npmjs.org 2>/dev/null || true)"
            [[ "${published}" = "${SDK_VERSION}" ]] && break
            sleep 5
          done
          test "${published}" = "${SDK_VERSION}"
          tag="v${SDK_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
            test "$(git rev-list -n 1 "${tag}")" = "${GITHUB_SHA}"
          else
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi

  pull-request-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install, test, and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --global npm@12.0.2
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high
          npm pack --dry-run
          git diff --exit-code
